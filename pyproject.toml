[project]
name = "coverRAG"
version = "0.1.0"
description = "CoVER-RAG: Evidence Sufficiency-Guided Coverage and Claim Verification for Multi-hop Question Answering"
readme = "README.md"
requires-python = "==3.10.16"
dependencies = [
    "omegaconf>=2.3.0",
    "hydra-colorlog>=1.2.0",
    "tqdm>=4.67.1",
    "python-dotenv>=1.0",
    "uvicorn>=0.34.0",
    "base58>=2.1.1",
    "aiohttp>=3.11.14",
    "tenacity>=9.0.0",
    "nltk>=3.9.1",
    "pytrec-eval>=0.5",
    "rouge>=1.0.1",
    "huggingface-hub>=0.30.2",
    "datasets>=3.5.0",
    "fastapi>=0.115.12",
    "cr-utils>=0.2.7",
    "sentence-transformers",
    "hydra-core>=1.3",
    "numpy",
    "pandas",
    "prettytable",
    "pydantic>=2",
    "requests",
    "openai",
    "litellm",
    "tiktoken",
    "torch",
    "transformers",
    "tokenizers",
    "chonkie",
    "sentencepiece",
]

[project.optional-dependencies]
retrieve = [
    "faiss-gpu-cu12",
]
llm = [
    "vllm",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
